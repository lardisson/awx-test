AWX:
  # enable use of awx-deploy template
  enabled: false
  name: awx
  spec:
    admin_user: admin

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    #alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:317524173582:regional/webacl/aw1-maag-n-wf001/3b8148ed-15f0-43fd-b590-a68bcdfbaf5e
    #alb.ingress.kubernetes.io/certificate-arn: arn:aws:a cm:us-east-1:317524173582:certificate/6da0aac3-879f-44f9-91b8-79c193d67a46
    #alb.ingress.kubernetes.io/healthcheck-path: /
    #alb.ingress.kubernetes.io/scheme: internet-facing
  hosts:
    - host: app.test
      paths:
        - path: /
          pathType: Prefix

  # configurations for external postgres instance
  postgres:
    enabled: false
    host: Unset
    port: 5678
    dbName: Unset
    username: admin
    # for secret management, pass in the password independently of this file
    # at the command line, use --set AWX.postgres.password
    password: Unset
    sslmode: prefer
    type: unmanaged
